services:
  - type: web
    name: premii-workspace
    runtime: static
    branch: main
    buildCommand: npm ci --ignore-scripts --no-audit --no-fund && npm run build
    staticPublishPath: ./public
    envVars:
      - key: NODE_VERSION
        value: "24"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
