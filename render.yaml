services:
  - type: web
    name: cgmh-premii-tracker-free
    runtime: node
    repo: https://github.com/UyenTLT/PREMII-
    branch: main
    region: singapore
    plan: free
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: cgmh-premii-db
          property: connectionString
      - key: SETUP_TOKEN
        generateValue: true

databases:
  - name: cgmh-premii-db
    plan: free
    region: singapore
    databaseName: premii
    user: premii
